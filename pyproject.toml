[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sembrowse"
version = "0.1.0"
description = "Portable local browser decisions backed by SemIf and Jev Ultrafast"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [{name = "AnEntrypoint"}]
dependencies = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
  "semif-phase1 @ git+https://github.com/TheoLeeCJ/SemIf-OpenJev.git@23cf1f39fc9534fe81437200959b6dfc7106e45a",
]

[project.scripts]
sembrowse-server = "sembrowse.service:main"
sembrowse-jev = "sembrowse.jev:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sembrowse"]

[tool.hatch.metadata]
allow-direct-references = true
