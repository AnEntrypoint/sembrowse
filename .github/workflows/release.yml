name: Release portable plugins

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.19"
      - run: uv sync --locked
      - run: uv run python -c "from sembrowse.engine import SemIfEngine; from sembrowse.service import Service; from sembrowse.jev import install_local_adapter; install_local_adapter('http://127.0.0.1:8787/v1/choose'); print('local adapter imports')"
      - run: uv run python scripts/build_extensions.py "0.1.0"
      - run: sha256sum dist/* > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: snapshot-${{ github.sha }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Sembrowse $TAG" --prerelease --generate-notes
          gh release upload "$TAG" dist/* --clobber
