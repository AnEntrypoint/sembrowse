name: Publish Sembrowse release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: version
        run: node -p "'value=' + require('./extension/manifest.json').version" >> "$GITHUB_OUTPUT"
  release:
    needs: version
    runs-on: ubuntu-latest
    concurrency:
      group: sembrowse-release-v${{ needs.version.outputs.value }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: node --check extension/content.js
      - run: node --check extension/popup.js
      - run: node --check extension/runner.js
      - run: node --check extension/inference_worker.js
      - run: python scripts/build_extensions.py "${{ needs.version.outputs.value }}"
      - run: cd dist && sha256sum *.zip > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Sembrowse $TAG" --generate-notes --latest
