name: Release portable plugins

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: node --check extension/content.js
      - run: node --check extension/popup.js
      - run: node --check extension/inference_worker.js
      - run: python scripts/build_extensions.py "0.1.0"
      - run: sha256sum dist/* > dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: snapshot-${{ github.sha }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Sembrowse $TAG" --prerelease --generate-notes
          gh release upload "$TAG" dist/* --clobber
